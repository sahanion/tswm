<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A Little Spring Garden For Muskan 🌷</title>
  
  <!-- Romantic Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-ivory: #FAF4EB;
      --bg-cream: #FFFDF9;
      --text-main: #5C3D37;
      --text-sub: #845F57;
      --accent-flourish: #B2827A;
      --btn-bg: rgba(242, 210, 210, 0.85);
      --btn-hover-bg: rgba(247, 222, 222, 0.96);
      --btn-border: rgba(212, 168, 168, 0.75);
      --btn-text: #5A3933;
      --footer-color: #9E7B74;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100svh;
      background-color: var(--bg-ivory);
      overflow: hidden;
      font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Fullscreen Stage */
    .garden-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100svh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at 48% 42%, #FFFDF9 0%, #FAF3EA 55%, #F4E7DC 100%);
    }

    .welcome-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: max(14px, env(safe-area-inset-top, 14px)) max(14px, env(safe-area-inset-right, 14px)) max(14px, env(safe-area-inset-bottom, 14px)) max(14px, env(safe-area-inset-left, 14px));
      overflow-y: auto;
      overscroll-behavior: contain;
      background: rgba(72, 44, 39, .3);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 1;
      transition: opacity .45s ease;
    }

    .welcome-overlay.is-closing { opacity: 0; pointer-events: none; }
    .welcome-overlay[hidden] { display: none; }

    .welcome-note {
      position: relative;
      width: min(100%, 440px);
      max-height: 100%;
      padding: clamp(30px, 7vw, 48px) clamp(24px, 7vw, 48px) 34px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      text-align: center;
      color: #684844;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(255,255,255,.75), transparent 40%),
        linear-gradient(145deg, rgba(255,250,239,.98), rgba(250,228,218,.98));
      border: 1px solid rgba(169, 117, 104, .55);
      border-radius: 9px 18px 10px 16px;
      box-shadow: 0 20px 60px rgba(68, 39, 34, .3), inset 0 0 0 5px rgba(255,255,255,.32);
      animation: welcomeArrive .65s cubic-bezier(.2,.8,.25,1) both;
    }

    .welcome-note::before,
    .welcome-note::after {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(177, 128, 111, .34);
      border-radius: 5px 13px 6px 11px;
      pointer-events: none;
    }

    .welcome-note::after {
      inset: 17px;
      border-style: dashed;
      border-color: rgba(190, 144, 122, .22);
    }

    .welcome-flower {
      position: absolute;
      z-index: 1;
      color: #c17e83;
      text-shadow: 0 2px 5px rgba(151, 96, 87, .18);
      pointer-events: none;
    }

    .welcome-flower.top-left { top: 17px; left: 25px; font-size: 27px; transform: rotate(-18deg); }
    .welcome-flower.top-right { top: 23px; right: 28px; color: #9eaa85; font-size: 21px; transform: rotate(14deg); }
    .welcome-flower.bottom-left { bottom: 20px; left: 31px; color: #d99b91; font-size: 19px; }
    .welcome-flower.bottom-right { right: 28px; bottom: 19px; color: #9eaa85; font-size: 25px; transform: rotate(-12deg); }

    .welcome-title {
      position: relative;
      z-index: 2;
      color: #744c48;
      font: 600 clamp(2rem, 8vw, 2.8rem)/1.08 'Playfair Display', Georgia, serif;
    }

    .welcome-copy {
      position: relative;
      z-index: 2;
      margin: 19px auto 0;
      max-width: 330px;
      font: 500 clamp(18px, 4.5vw, 21px)/1.45 'Cormorant Garamond', Georgia, serif;
    }

    .welcome-sound-btn {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
      margin-top: 24px;
      padding: 10px 25px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 999px;
      color: #fffaf4;
      background: linear-gradient(135deg, #bd747d, #a95f6e);
      box-shadow: 0 7px 20px rgba(146, 77, 88, .3), inset 0 1px 0 rgba(255,255,255,.55);
      font: 700 clamp(21px, 5vw, 25px) 'Playfair Display', Georgia, serif;
      letter-spacing: .04em;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .welcome-sound-btn:hover,
    .welcome-sound-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 9px 24px rgba(146, 77, 88, .38), inset 0 1px 0 rgba(255,255,255,.6);
    }

    .welcome-sound-btn:focus-visible { outline: 3px solid #87575a; outline-offset: 3px; }

    .sound-speaker { font-size: 27px; line-height: 1; }

    .sound-waves {
      display: inline-block;
      font: 700 24px/1 Arial, sans-serif;
      animation: soundWave 1.8s ease-in-out infinite;
      transform-origin: left center;
    }

    .welcome-sound-btn.is-on .sound-waves { animation-duration: 1.25s; }

    @keyframes soundWave {
      0%, 100% { opacity: .65; transform: scale(.94); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .welcome-get-in {
      position: relative;
      z-index: 2;
      min-width: 155px;
      min-height: 48px;
      margin-top: 22px;
      padding: 10px 28px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 999px;
      color: #fffaf4;
      background: linear-gradient(135deg, #cf8790, #b96f7b);
      box-shadow: 0 5px 15px rgba(154, 85, 94, .25), inset 0 1px 0 rgba(255,255,255,.55);
      font: 600 18px 'Playfair Display', Georgia, serif;
      letter-spacing: .04em;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .welcome-get-in:hover,
    .welcome-get-in:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 8px 19px rgba(154, 85, 94, .3), inset 0 1px 0 rgba(255,255,255,.6);
    }

    .welcome-get-in:focus-visible { outline: 3px solid #87575a; outline-offset: 3px; }

    @keyframes welcomeArrive {
      from { opacity: 0; transform: translateY(12px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 420px) {
      .welcome-note { padding: 38px 22px 25px; }
      .welcome-flower.top-left { top: 12px; left: 18px; }
      .welcome-flower.top-right { top: 17px; right: 20px; }
    }

    @media (max-height: 700px) and (orientation: portrait) {
      .welcome-overlay { place-items: start center; }
      .welcome-note { margin-block: auto; padding-top: 32px; padding-bottom: 20px; }
      .welcome-copy { margin-top: 12px; font-size: clamp(16px, 4.2vw, 19px); }
      .welcome-sound-btn { min-height: 54px; margin-top: 16px; }
      .welcome-get-in { min-height: 46px; margin-top: 14px; }
    }

    /* Illustrated Garden Background */
    .garden-scenery {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('garden_bg.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      animation: sceneFadeIn 1.6s cubic-bezier(0.2, 0.8, 0.25, 1) 0.1s forwards;
    }

    /* Mobile Responsive Corner Illustrations */
    .mobile-left-overlay,
    .mobile-right-overlay {
      display: none;
      position: absolute;
      bottom: 0;
      pointer-events: none;
      z-index: 2;
    }

    .mobile-left-overlay {
      left: 0;
      width: clamp(210px, 48vw, 360px);
    }

    .mobile-right-overlay {
      right: 0;
      width: clamp(210px, 48vw, 360px);
    }

    .mobile-left-overlay img,
    .mobile-right-overlay img {
      width: 100%;
      height: auto;
      display: block;
    }



    /* Dreamy Sunlight Beams */
    .sunlight-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      background: 
        radial-gradient(ellipse at 15% 12%, rgba(255, 255, 250, 0.45) 0%, transparent 55%),
        linear-gradient(132deg, rgba(255, 250, 238, 0.38) 0%, rgba(255, 245, 232, 0.14) 38%, transparent 68%);
      mix-blend-mode: soft-light;
      animation: sunlightShimmer 10s ease-in-out infinite alternate;
    }

    /* Particle / Petal Layer */
    .petal-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
    }

    /* Central Content Card */
    .center-content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(14px, 3vw, 32px);
      max-width: 660px;
      width: 92%;
      margin: 0 auto;
    }

    /* Main Heading */
    .greeting-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: clamp(10px, 2.2vh, 20px);
      width: 100%;
      opacity: 0;
      transform: translateY(18px);
      animation: gentleRise 1.1s cubic-bezier(0.2, 0.8, 0.3, 1) 0.35s forwards;
    }

    .main-title {
      font-size: clamp(2.0rem, 7.2vw, 4.2rem);
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.15;
      letter-spacing: 0.015em;
      text-shadow: 
        0 1px 2px rgba(255, 250, 244, 0.95),
        0 3px 12px rgba(92, 61, 55, 0.06);
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      white-space: nowrap;
    }

    .title-heart {
      font-size: 0.65em;
      color: #A36B62;
      margin-left: 6px;
      font-weight: 400;
      display: inline-block;
      transform: translateY(-2px);
    }

    /* Ribbon Flourish Underline */
    .ribbon-flourish-wrap {
      width: clamp(180px, 50vw, 340px);
      height: clamp(26px, 4.5vh, 36px);
      margin-top: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: scale(0.92);
      animation: flourishAppear 1.2s ease-out 0.65s forwards;
    }

    .ribbon-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-line {
      stroke: var(--accent-flourish);
      stroke-width: 1.7;
      stroke-linecap: round;
      fill: none;
    }

    .bow-loop {
      stroke: var(--accent-flourish);
      stroke-width: 1.7;
      fill: #F5DFDC;
      fill-opacity: 0.55;
    }

    .bow-knot {
      fill: var(--accent-flourish);
    }

    .bow-tail {
      stroke: var(--accent-flourish);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
    }

    /* Subtitle */
    .subtitle {
      font-size: clamp(0.96rem, 2.5vw, 1.5rem);
      font-weight: 500;
      color: var(--text-sub);
      line-height: 1.45;
      letter-spacing: 0.065em;
      margin-bottom: clamp(20px, 3.8vh, 38px);
      text-shadow: 0 1px 2px rgba(255, 250, 245, 0.9);
      max-width: 92%;
      opacity: 0;
      transform: translateY(14px);
      animation: gentleRise 1.1s cubic-bezier(0.2, 0.8, 0.3, 1) 0.95s forwards;
    }

    .sub-heart {
      color: #A87168;
      font-size: 0.9em;
      margin-left: 2px;
      display: inline-block;
    }

    /* Main Action Button */
    .button-wrapper {
      position: relative;
      margin-bottom: clamp(26px, 5vh, 52px);
      opacity: 0;
      transform: translateY(16px);
      animation: gentleRise 1.1s cubic-bezier(0.2, 0.8, 0.3, 1) 1.25s forwards;
    }

    .garden-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.5vw, 12px);
      padding: clamp(11px, 2vh, 16px) clamp(18px, 4vw, 38px);
      background-color: var(--btn-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid var(--btn-border);
      border-radius: 9999px;
      color: var(--btn-text);
      font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      font-size: clamp(0.95rem, 2.3vw, 1.35rem);
      font-weight: 600;
      letter-spacing: 0.025em;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 
        0 6px 20px rgba(190, 135, 135, 0.18),
        0 1px 3px rgba(120, 80, 80, 0.08),
        inset 0 1px 2px rgba(255, 255, 255, 0.85);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      outline: none;
      white-space: nowrap;
      max-width: 94vw;
    }

    .garden-btn:hover {
      transform: translateY(-3px) scale(1.018);
      background-color: var(--btn-hover-bg);
      border-color: rgba(200, 145, 145, 0.92);
      box-shadow: 
        0 12px 28px rgba(190, 125, 125, 0.28),
        0 2px 6px rgba(120, 80, 80, 0.1),
        inset 0 1px 3px rgba(255, 255, 255, 0.95);
      color: #4A2822;
    }

    .garden-btn:active {
      transform: translateY(-1px) scale(0.99);
      box-shadow: 
        0 4px 14px rgba(190, 125, 125, 0.2),
        inset 0 1px 2px rgba(255, 255, 255, 0.7);
    }

    .garden-btn:focus-visible {
      box-shadow: 
        0 0 0 3px rgba(230, 180, 180, 0.6),
        0 8px 24px rgba(190, 125, 125, 0.25);
    }

    .btn-flower {
      font-size: 1.15em;
      color: #8C544B;
      transform: translateY(-1px);
      transition: transform 0.35s ease;
    }

    .btn-arrow {
      font-size: 1.2em;
      color: #6C423B;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    .garden-btn:hover .btn-flower {
      transform: rotate(24deg) scale(1.1);
    }

    .garden-btn:hover .btn-arrow {
      transform: translateX(4px);
    }

    /* Subtle Sparkle on Button */
    .btn-sparkle {
      position: absolute;
      top: -8px;
      right: 18px;
      font-size: 15px;
      color: #D9887B;
      opacity: 0.8;
      pointer-events: none;
      animation: sparkleGlint 3s ease-in-out infinite;
    }

    /* Footer */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(12px);
      animation: gentleRise 1.1s cubic-bezier(0.2, 0.8, 0.3, 1) 1.55s forwards;
    }

    .footer-text {
      font-size: clamp(0.92rem, 2.1vw, 1.1rem);
      font-weight: 500;
      color: var(--footer-color);
      letter-spacing: 0.12em;
      text-transform: lowercase;
    }

    .footer-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: clamp(140px, 32vw, 220px);
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(178, 130, 122, 0.45), transparent);
    }

    .footer-heart {
      font-size: 0.95em;
      color: #B5847C;
      transform: translateY(-1px);
    }

    /* Atmospheric Twinkling Stars */
    .twinkle-star {
      position: absolute;
      pointer-events: none;
      color: #D49C82;
      font-family: sans-serif;
      line-height: 1;
      filter: drop-shadow(0 0 2px rgba(255, 235, 215, 0.8));
      z-index: 4;
      animation: starTwinkle 3.8s ease-in-out infinite;
    }

    /* Drifting Soft Petal */
    .drifting-petal {
      position: absolute;
      pointer-events: none;
      will-change: transform, opacity;
      filter: drop-shadow(0 2px 5px rgba(220, 140, 140, 0.2));
    }

    /* Page Exit Transition */
    body.page-leaving {
      transition: opacity 0.65s cubic-bezier(0.4, 0, 0.2, 1), filter 0.65s ease;
      opacity: 0;
      filter: blur(4px);
    }

    /* Keyframes */
    @keyframes sceneFadeIn {
      from { opacity: 0; transform: scale(1.015); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes gentleRise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flourishAppear {
      from { opacity: 0; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes sunlightShimmer {
      0% { opacity: 0.65; transform: scale(1); }
      100% { opacity: 0.9; transform: scale(1.02); }
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1.18); }
    }

    @keyframes sparkleGlint {
      0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(45deg); }
    }

    @keyframes petalFloat {
      0% {
        transform: translateY(-40px) translateX(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      15% {
        opacity: 0.85;
      }
      50% {
        transform: translateY(50vh) translateX(var(--drift, 35px)) rotate(var(--rot, 80deg)) scale(1);
      }
      85% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh) translateX(calc(var(--drift, 35px) * -1.2)) rotate(calc(var(--rot, 80deg) * 2.2)) scale(0.9);
        opacity: 0;
      }
    }

    /* Switch to clean corner framing on mobile & portrait screens */
    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
      .garden-scenery {
        display: none; /* Hide wide desktop background on mobile */
      }
      .mobile-left-overlay,
      .mobile-right-overlay {
        display: block;
        opacity: 0;
        animation: sceneFadeIn 1.4s ease-out 0.2s forwards;
        max-height: 35vh;
        -webkit-mask-image: linear-gradient(to top, black 50%, transparent 100%);
        mask-image: linear-gradient(to top, black 50%, transparent 100%);
      }
      .mobile-left-overlay {
        left: 0;
        bottom: 0;
        width: clamp(160px, 48vw, 240px);
      }
      .mobile-right-overlay {
        right: 0;
        bottom: 0;
        width: clamp(160px, 48vw, 240px);
      }
      .center-content {
        justify-content: flex-start;
        padding-top: max(env(safe-area-inset-top, 20px), 5vh);
        padding-bottom: 33vh;
        width: 100%;
        max-width: 360px;
        padding-left: 10px;
        padding-right: 10px;
      }
      .greeting-header {
        margin-bottom: 8px;
      }
      .main-title {
        font-size: clamp(1.85rem, 8vw, 2.6rem);
      }
      .title-heart {
        font-size: 0.6em;
        margin-left: 4px;
      }
      .ribbon-flourish-wrap {
        width: clamp(175px, 58vw, 240px);
        height: 26px;
      }
      .subtitle {
        font-size: clamp(0.92rem, 3.6vw, 1.15rem);
        letter-spacing: 0.04em;
        margin-bottom: 18px;
        max-width: 290px;
      }
      .button-wrapper {
        margin-bottom: 20px;
        width: 100%;
      }
      .garden-btn {
        padding: 11px 18px;
        font-size: clamp(0.82rem, 3.2vw, 1.05rem);
        gap: 6px;
        max-width: 100%;
        white-space: nowrap;
      }
      .btn-flower {
        font-size: 1.05em;
      }
      .btn-arrow {
        font-size: 1.1em;
      }
      .footer-text {
        font-size: 0.88rem;
      }
      .music-toggle-btn {
        width: 36px;
        height: 36px;
        top: max(14px, env(safe-area-inset-top, 14px));
        right: max(14px, env(safe-area-inset-right, 14px));
      }
      .music-toggle-btn svg {
        width: 16px;
        height: 16px;
      }
    }

    /* Discreet Background Music Toggle Button */
    .music-toggle-btn {
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(16px, env(safe-area-inset-right, 16px));
      z-index: 50;
      width: clamp(38px, 4.2vw, 44px);
      height: clamp(38px, 4.2vw, 44px);
      border-radius: 50%;
      background: rgba(255, 252, 247, 0.88);
      border: 1px solid rgba(212, 168, 168, 0.75);
      color: #5C3D37;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(90, 50, 45, 0.12);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
      opacity: 0.85;
    }

    .music-toggle-btn:hover {
      opacity: 1;
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 6px 20px rgba(90, 50, 45, 0.18);
    }

    .music-toggle-btn:active {
      transform: scale(0.96);
    }

    .music-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.25s ease;
    }

    .music-toggle-btn.is-playing .music-note {
      animation: musicBeat 2.2s ease-in-out infinite;
    }

    @keyframes musicBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12) rotate(4deg); }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .petal-layer, .btn-sparkle {
        display: none !important;
      }
    }

    /* Portrait screens: keep the invitation centered and the controls easy to read. */
    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
      .center-content {
        justify-content: center;
        width: min(100%, 520px);
        max-width: 520px;
        padding: max(20px, env(safe-area-inset-top, 20px)) 18px max(22px, env(safe-area-inset-bottom, 22px));
      }
      .greeting-header { margin-bottom: 12px; }
      .main-title {
        max-width: 100%; white-space: normal; text-wrap: balance;
        font-size: clamp(34px, 9vw, 46px); line-height: 1.12;
      }
      .ribbon-flourish-wrap { width: min(62vw, 250px); height: 30px; }
      .subtitle {
        max-width: 340px; margin-bottom: 24px;
        font-size: clamp(19px, 5vw, 22px); line-height: 1.4;
        letter-spacing: .025em;
      }
      .button-wrapper { width: 100%; margin-bottom: 14px; }
      .garden-btn {
        min-height: 56px; max-width: 100%; white-space: normal;
        padding: 13px 22px; gap: 8px;
        font-size: clamp(17px, 4.5vw, 19px); line-height: 1.15;
      }
      .footer-text { font-size: 15px; }
      .mobile-left-overlay, .mobile-right-overlay {
        width: clamp(145px, 39vw, 220px); max-height: 27vh;
        opacity: .82;
      }
      .welcome-note {
        width: min(100%, 440px); max-height: calc(100dvh - 28px);
        padding: 46px 28px 30px;
      }
      .welcome-title { font-size: clamp(34px, 9vw, 43px); }
      .welcome-copy { font-size: clamp(19px, 5vw, 22px); line-height: 1.4; }
      .welcome-sound-btn {
        min-height: 60px; margin-top: 22px; padding: 11px 25px;
        font-size: clamp(23px, 6vw, 27px);
      }
      .welcome-get-in { min-height: 52px; margin-top: 18px; font-size: 19px; }
    }

    @media (max-height: 700px) and (orientation: portrait) {
      .center-content { padding-top: 18px; padding-bottom: 18px; }
      .subtitle { margin-bottom: 14px; }
      .welcome-note { padding-top: 38px; padding-bottom: 24px; }
      .welcome-copy { margin-top: 12px; }
      .welcome-sound-btn { min-height: 54px; margin-top: 15px; }
      .welcome-get-in { min-height: 46px; margin-top: 12px; }
    }
  </style>
</head>
<body>
  <div class="garden-viewport">
    <section class="welcome-overlay" id="welcomeOverlay" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" aria-describedby="welcomeCopy">
      <div class="welcome-note">
        <span class="welcome-flower top-left" aria-hidden="true">&#10047;</span>
        <span class="welcome-flower top-right" aria-hidden="true">&#10048;</span>
        <span class="welcome-flower bottom-left" aria-hidden="true">&#10046;</span>
        <span class="welcome-flower bottom-right" aria-hidden="true">&#10047;</span>
        <h1 class="welcome-title" id="welcomeTitle">Hi, Muskan.</h1>
        <p class="welcome-copy" id="welcomeCopy">I hope it brings you a smile and reminds you how special you are to me.</p>
        <button class="welcome-sound-btn" id="welcomeSoundBtn" type="button" aria-describedby="welcomeCopy">
          <span class="sound-speaker" aria-hidden="true">&#128266;</span>
          <span>Sound On</span>
          <span class="sound-waves" aria-hidden="true">)))</span>
        </button>
        <button class="welcome-get-in" id="welcomeGetIn" type="button" autofocus>Get in <span aria-hidden="true">&#10047;</span></button>
      </div>
    </section>

    <!-- Discreet Music Toggle Button -->
    <button class="music-toggle-btn" id="musicToggle" aria-label="Toggle Background Music" title="Background Music (M)" aria-hidden="true" tabindex="-1">
      <svg class="music-note" id="musicIconOn" viewBox="0 0 24 24">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </svg>
      <svg class="music-note-off" id="musicIconOff" viewBox="0 0 24 24" style="display: none;">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
        <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2" />
      </svg>
    </button>

    <!-- Ambient Background Audio: Loops from the start until candles are blown -->
    <audio id="bgMusic" loop preload="auto">
      <source src="final-rfiy.mp3" type="audio/mpeg">
      <source src="final-rfin.mp3" type="audio/mpeg">
    </audio>

    <!-- Desktop & Landscape Scenery -->
    <div class="garden-scenery" aria-hidden="true"></div>

    <!-- Mobile Screen Responsive Corner Overlays -->
    <div class="mobile-left-overlay" aria-hidden="true">
      <img src="garden_left.png" alt="Sunny window with cute panda and pink tulips" />
    </div>
    <div class="mobile-right-overlay" aria-hidden="true">
      <img src="garden_right.png" alt="Stack of books with blossoming pink tulips" />
    </div>

    <!-- Dreamy Sunlight Shimmer -->
    <div class="sunlight-overlay" aria-hidden="true"></div>

    <!-- Floating Petals & Twinkle Stars Layer -->
    <div class="petal-layer" id="petalLayer" aria-hidden="true">
      <!-- Hand-drawn Twinkle Stars placed tastefully like the concept art -->
      <span class="twinkle-star" style="top: 18%; left: 33%; font-size: 14px; animation-delay: 0.2s;">✦</span>
      <span class="twinkle-star" style="top: 26%; left: 29%; font-size: 10px; animation-delay: 1.5s;">✧</span>
      <span class="twinkle-star" style="top: 28%; left: 38%; font-size: 12px; animation-delay: 2.8s;">✦</span>
      <span class="twinkle-star" style="top: 20%; right: 33%; font-size: 13px; animation-delay: 0.9s;">✦</span>
      <span class="twinkle-star" style="top: 25%; right: 29%; font-size: 16px; animation-delay: 2.1s;">✧</span>
      <span class="twinkle-star" style="top: 72%; right: 30%; font-size: 12px; animation-delay: 1.8s;">✦</span>
    </div>

    <!-- Central Garden Invitation -->
    <main class="center-content" aria-hidden="true">
      <!-- Main Heading -->
      <header class="greeting-header">
        <h1 class="main-title">
          Hey, Muskan.<span class="title-heart" aria-hidden="true">♡</span>
        </h1>
        <!-- Delicate Ribbon Bow Underline -->
        <div class="ribbon-flourish-wrap" aria-hidden="true">
          <svg class="ribbon-flourish" viewBox="0 0 360 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 40,22 C 90,14 135,16 166,22" class="flourish-line" />
            <path d="M 194,22 C 225,16 270,14 320,22" class="flourish-line" />
            <path d="M 178,21 C 168,11 156,15 160,22 C 164,27 173,24 178,21 Z" class="bow-loop" />
            <path d="M 182,21 C 192,11 204,15 200,22 C 196,27 187,24 182,21 Z" class="bow-loop" />
            <ellipse cx="180" cy="21" rx="3.5" ry="4" class="bow-knot" />
            <path d="M 177,24 C 173,29 168,34 164,36" class="bow-tail" />
            <path d="M 183,24 C 187,29 192,34 196,36" class="bow-tail" />
          </svg>
        </div>
      </header>

      <!-- Subtitle -->
      <p class="subtitle">
        there's a little something waiting for you <span class="sub-heart">♡</span>
      </p>

      <!-- Main Action Button -->
      <div class="button-wrapper">
        <a href="scrapbook.html" class="garden-btn" id="enterBtn" role="button">
          <span class="btn-text">There's something I made for you</span>
          <span class="btn-flower">✿</span>
          <span class="btn-sparkle" aria-hidden="true">✧</span>
        </a>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p class="footer-text">just for you, always</p>
        <div class="footer-divider" aria-hidden="true">
          <span class="divider-line"></span>
          <span class="footer-heart">♡</span>
          <span class="divider-line"></span>
        </div>
      </footer>
    </main>
  </div>

  <script>
    // 1. Smooth Page Transition when clicking the button
    const enterBtn = document.getElementById('enterBtn');
    if (enterBtn) {
      enterBtn.addEventListener('click', function(e) {
        e.preventDefault();
        // Save current music state and position for seamless transition
        if (bgMusic && !bgMusic.paused) {
          sessionStorage.setItem('bgMusicTime', bgMusic.currentTime.toString());
          sessionStorage.setItem('bgMusicPlaying', 'true');
        } else if (!isMusicManuallyMuted && bgMusic) {
          // If audio hadn't started yet due to browser autoplay policy,
          // this click gesture satisfies user interaction!
          bgMusic.volume = 0.65;
          bgMusic.play().catch(() => {});
          sessionStorage.setItem('bgMusicPlaying', 'true');
          sessionStorage.setItem('bgMusicTime', '0');
        }
        const targetUrl = this.getAttribute('href');
        document.body.classList.add('page-leaving');
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 550);
      });
    }

    // 2. Slow, graceful tulip petals drifting downward
    const petalLayer = document.getElementById('petalLayer');

    function createPetalSvg(size, petalColor) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 32 32');
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.innerHTML = `
        <defs>
          <linearGradient id="petalGrad-${Math.random().toString(36).substr(2, 6)}" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#FFE3E7" />
            <stop offset="55%" stop-color="${petalColor}" />
            <stop offset="100%" stop-color="#DE8290" />
          </linearGradient>
        </defs>
        <path d="M16 2 C23 6 30 14 26 23 C22 30 11 31 6 24 C2 17 8 8 16 2 Z"
              fill="url(#petalGrad-default)" />
      `;
      const grad = svg.querySelector('linearGradient');
      const path = svg.querySelector('path');
      path.setAttribute('fill', `url(#${grad.id})`);
      return svg;
    }

    const petalColors = ['#F9A7B3', '#FCA5B0', '#F7B2BC', '#EE9BA8', '#FAB1BD'];

    function spawnPetal() {
      if (document.hidden) return;
      if (petalLayer.querySelectorAll('.drifting-petal').length >= 4) return;

      const size = Math.floor(Math.random() * 8) + 20; // 20px - 28px
      const startLeft = Math.random() * 80 + 10; // 10% - 90%
      const duration = Math.random() * 6 + 11; // 11s - 17s (slow, tranquil drift)
      const drift = (Math.random() - 0.5) * 80;
      const rot = Math.floor(Math.random() * 120) + 60;
      const color = petalColors[Math.floor(Math.random() * petalColors.length)];

      const petal = document.createElement('div');
      petal.className = 'drifting-petal';
      petal.style.left = startLeft + '%';
      petal.style.top = '-35px';
      petal.style.setProperty('--drift', drift + 'px');
      petal.style.setProperty('--rot', rot + 'deg');
      petal.style.animation = `petalFloat ${duration}s cubic-bezier(0.3, 0.2, 0.4, 0.9) forwards`;

      petal.appendChild(createPetalSvg(size, color));
      petalLayer.appendChild(petal);

      setTimeout(() => petal.remove(), duration * 1000);
    }

    // Initial petals with staggered delays
    setTimeout(spawnPetal, 800);
    setTimeout(spawnPetal, 3500);
    setInterval(spawnPetal, 4500);

    // ═══════════════════════════════════════════════════════════
    // BACKGROUND MUSIC CONTROLLER
    // "play final-rfiy.mp3 from the start, till the 'blow candle' button hits. on a loop."
    // ═══════════════════════════════════════════════════════════
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    const musicIconOn = document.getElementById('musicIconOn');
    const musicIconOff = document.getElementById('musicIconOff');

    // Fresh start from the garden resets the candle-stopped flag
    sessionStorage.removeItem('bgMusicStopped');

    const musicPreferenceKey = 'muskanMusicManuallyMuted';
    // A new visit to the opening page always starts with music enabled.
    // The preference is still respected while moving through the scrapbook pages.
    sessionStorage.setItem(musicPreferenceKey, 'false');
    let isMusicManuallyMuted = false;

    function updateMusicButtonUi(isPlaying) {
      if (!musicToggle) return;
      if (isPlaying) {
        musicToggle.classList.add('is-playing');
        if (musicIconOn) musicIconOn.style.display = 'block';
        if (musicIconOff) musicIconOff.style.display = 'none';
        musicToggle.setAttribute('title', 'Pause Music');
        musicToggle.setAttribute('aria-label', 'Pause Music');
      } else {
        musicToggle.classList.remove('is-playing');
        if (musicIconOn) musicIconOn.style.display = 'none';
        if (musicIconOff) musicIconOff.style.display = 'block';
        musicToggle.setAttribute('title', 'Play Music');
        musicToggle.setAttribute('aria-label', 'Play Music');
      }
    }

    function startBgMusic() {
      if (!bgMusic || isMusicManuallyMuted) return;
      bgMusic.volume = 0.65;
      bgMusic.loop = true;

      const playPromise = bgMusic.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            updateMusicButtonUi(true);
            sessionStorage.setItem('bgMusicPlaying', 'true');
          })
          .catch(() => {
            // Autoplay prevented before first user interaction
            updateMusicButtonUi(false);
          });
      }
    }

    if (musicToggle) {
      musicToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!bgMusic) return;

        if (!bgMusic.paused) {
          isMusicManuallyMuted = true;
          sessionStorage.setItem(musicPreferenceKey, 'true');
          bgMusic.pause();
          updateMusicButtonUi(false);
          sessionStorage.setItem('bgMusicPlaying', 'false');
        } else {
          isMusicManuallyMuted = false;
          sessionStorage.setItem(musicPreferenceKey, 'false');
          bgMusic.volume = 0.65;
          bgMusic.play().then(() => {
            updateMusicButtonUi(true);
            sessionStorage.setItem('bgMusicPlaying', 'true');
          }).catch(() => {});
        }
      });
    }

    // Keyboard shortcut 'm' for mute/unmute
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M') && !e.target.matches('input, textarea')) {
        if (musicToggle) musicToggle.click();
      }
    });

    // Save currentTime before page navigation
    window.addEventListener('beforeunload', () => {
      if (bgMusic && !bgMusic.paused) {
        sessionStorage.setItem('bgMusicTime', bgMusic.currentTime.toString());
      }
    });

    // One-time gesture listener to start audio as soon as user touches or clicks anywhere
    const userGestureEvents = ['click', 'touchstart', 'pointerdown'];
    function unlockAudioOnGesture() {
      if (!isMusicManuallyMuted && bgMusic && bgMusic.paused) {
        startBgMusic();
      }
      userGestureEvents.forEach(evt => window.removeEventListener(evt, unlockAudioOnGesture));
    }
    userGestureEvents.forEach(evt => window.addEventListener(evt, unlockAudioOnGesture, { passive: true }));

    // Try starting on load if browser autoplay policy permits
    startBgMusic();

    const welcomeOverlay = document.getElementById('welcomeOverlay');
    const welcomeGetIn = document.getElementById('welcomeGetIn');
    const welcomeSoundBtn = document.getElementById('welcomeSoundBtn');
    const centerContent = document.querySelector('.center-content');
    if (welcomeSoundBtn) {
      welcomeSoundBtn.addEventListener('click', () => {
        isMusicManuallyMuted = false;
        sessionStorage.setItem(musicPreferenceKey, 'false');
        if (bgMusic) {
          bgMusic.volume = 0.65;
          bgMusic.loop = true;
          bgMusic.play().then(() => {
            updateMusicButtonUi(true);
            sessionStorage.setItem('bgMusicPlaying', 'true');
            welcomeSoundBtn.classList.add('is-on');
            welcomeSoundBtn.setAttribute('aria-pressed', 'true');
            welcomeSoundBtn.setAttribute('aria-label', 'Sound is on');
          }).catch(() => {});
        }
      });
    }
    if (welcomeGetIn && welcomeOverlay) {
      welcomeGetIn.focus();
      welcomeGetIn.addEventListener('click', () => {
        // The button click is a user gesture, so it also unlocks audio in browsers
        // that block autoplay until the visitor interacts with the page.
        if (!isMusicManuallyMuted && bgMusic && bgMusic.paused) startBgMusic();
        welcomeOverlay.classList.add('is-closing');
        window.setTimeout(() => {
          welcomeOverlay.hidden = true;
          welcomeOverlay.setAttribute('aria-hidden', 'true');
          if (musicToggle) {
            musicToggle.removeAttribute('aria-hidden');
            musicToggle.removeAttribute('tabindex');
          }
          if (centerContent) centerContent.setAttribute('aria-hidden', 'false');
          if (enterBtn) enterBtn.focus();
        }, 450);
      }, { once: true });
    }
  </script>
</body>
</html>
