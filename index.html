<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>A Little Spring Garden For Muskan 🌷</title>

  <!-- Romantic Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #2e1a17;
      --card-radius: clamp(12px, 2.2vw, 22px);
      --btn-glow: rgba(235, 160, 172, 0.45);
      --toggle-bg: rgba(255, 252, 247, 0.88);
      --toggle-border: rgba(212, 168, 168, 0.75);
      --toggle-color: #5C3D37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100svh;
      background-color: var(--bg-deep);
      overflow: hidden;
      font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ═══════════════════════════════════════════════════════════
       STAGE ARCHITECTURE (100% RESPONSIVE: 16:9, 9:16, TABLETS)
       ═══════════════════════════════════════════════════════════ */
    .viewport-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── 1. Blurred Backdrop (Second Image) ── */
    .backdrop-container {
      position: absolute;
      inset: -35px; /* Over-bleeds past edges so blur never leaves border halos */
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .backdrop-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: blur(20px) brightness(0.9) saturate(1.18);
      transform: scale(1.08); /* Scales slightly to avoid edge-fade clipping */
      transform-origin: center;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    /* Dreamy Ambient Vignette and Warm Tint */
    .backdrop-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(255, 245, 238, 0.12) 0%, rgba(55, 28, 24, 0.42) 75%, rgba(35, 16, 14, 0.65) 100%),
        linear-gradient(180deg, rgba(35, 18, 16, 0.3) 0%, transparent 40%, rgba(35, 18, 16, 0.4) 100%);
    }

    /* ── 2. Drifting Petals Layer ── */
    .petal-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    .drifting-petal {
      position: absolute;
      pointer-events: none;
      will-change: transform, opacity;
      filter: drop-shadow(0 2px 4px rgba(95, 45, 38, 0.18));
    }

    @keyframes petalFloat {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(0.85);
      }
      10% {
        opacity: 0.95;
      }
      85% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift, 50px), 108vh, 0) rotate(var(--rot, 180deg)) scale(1.05);
      }
    }

    /* ── 3. The 4:5 Size Card Container ── */
    .card-stage {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      width: 100%;
      height: 100%;
    }

    .card-4x5 {
      position: relative;
      /* Invariant formula: guarantees 4:5 ratio that never overflows 90vw nor 86svh */
      width: min(90vw, calc(86svh * 4 / 5), 560px);
      aspect-ratio: 4 / 5;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow:
        0 26px 65px -14px rgba(30, 12, 10, 0.58),
        0 14px 32px -8px rgba(30, 12, 10, 0.42),
        0 0 0 1px rgba(255, 235, 222, 0.38),
        inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      transform: translateZ(0);
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.25, 1), box-shadow 0.45s ease;
      animation: cardEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .card-4x5:hover {
      box-shadow:
        0 30px 75px -12px rgba(30, 12, 10, 0.65),
        0 18px 40px -8px rgba(30, 12, 10, 0.48),
        0 0 0 1px rgba(255, 240, 230, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-art {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* ── 4. Interactive Plaque Button ── */
    .card-action-btn {
      position: absolute;
      /* Aligned seamlessly to the illustrated plaque in opening_card.jpg */
      top: 47.8%;
      left: 22.8%;
      width: 54.4%;
      height: 7.4%;
      border-radius: 999px;
      cursor: pointer;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 225, 230, 0.001);
      border: 1.5px solid transparent;
      text-decoration: none;
      outline: none;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    /* Hover feedback: soft warm glow around the pill */
    .card-action-btn:hover {
      background: rgba(255, 230, 235, 0.16);
      border-color: rgba(215, 145, 158, 0.55);
      box-shadow:
        0 0 24px rgba(230, 150, 165, 0.45),
        inset 0 0 16px rgba(255, 255, 255, 0.35);
      transform: scale(1.025);
    }

    .card-action-btn:active {
      transform: scale(0.975);
      box-shadow:
        0 0 14px rgba(230, 150, 165, 0.3),
        inset 0 0 10px rgba(255, 255, 255, 0.25);
    }

    .card-action-btn:focus-visible {
      border-color: rgba(185, 105, 120, 0.8);
      box-shadow: 0 0 0 3px rgba(235, 180, 190, 0.65);
    }

    /* Periodic gentle travelling sheen across the plaque */
    .btn-shine {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      overflow: hidden;
      pointer-events: none;
    }

    .btn-shine::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.36), transparent);
      transform: skewX(-22deg);
      animation: plaqueSheen 4.2s ease-in-out infinite;
    }

    @keyframes plaqueSheen {
      0%, 70% { left: -100%; opacity: 0; }
      75% { opacity: 1; }
      100% { left: 200%; opacity: 0; }
    }

    /* Delicate sparkle badge indicator */
    .btn-sparkle-indicator {
      position: absolute;
      top: -9px;
      right: 7px;
      font-size: 14px;
      color: #c4828b;
      text-shadow: 0 0 6px rgba(255, 240, 245, 0.9);
      animation: sparkleTwinkle 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sparkleTwinkle {
      0%, 100% { opacity: 0.45; transform: scale(0.88) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.22) rotate(16deg); }
    }

    /* ── 5. Floating Music Toggle Button ── */
    .music-toggle-btn {
      position: absolute;
      top: max(18px, env(safe-area-inset-top, 18px));
      right: max(18px, env(safe-area-inset-right, 18px));
      z-index: 50;
      width: clamp(38px, 4.2vw, 44px);
      height: clamp(38px, 4.2vw, 44px);
      border-radius: 50%;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      color: var(--toggle-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(50, 20, 15, 0.25);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
      opacity: 0.9;
    }

    .music-toggle-btn:hover {
      opacity: 1;
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 6px 22px rgba(50, 20, 15, 0.32);
    }

    .music-toggle-btn:active {
      transform: scale(0.96);
    }

    .music-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.25s ease;
    }

    .music-toggle-btn.is-playing .music-note {
      animation: musicBeat 2.2s ease-in-out infinite;
    }

    @keyframes musicBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12) rotate(4deg); }
    }

    /* ── 6. Page Leaving Transition ── */
    body.page-leaving .card-4x5 {
      transform: scale(0.96) translateY(-10px);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.55s ease;
    }

    body.page-leaving .backdrop-image {
      transform: scale(1.16);
      opacity: 0.5;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    /* ── 7. Screen Reader Only Utility ── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── 8. Accessibility: Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .petal-layer, .btn-shine {
        display: none !important;
      }
    }

    /* ── 9. Compact Mobile Screen Adjustments (9:16) ── */
    @media (max-width: 480px) {
      .music-toggle-btn {
        width: 36px;
        height: 36px;
        top: max(14px, env(safe-area-inset-top, 14px));
        right: max(14px, env(safe-area-inset-right, 14px));
      }
      .music-toggle-btn svg {
        width: 16px;
        height: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="viewport-stage">
    <!-- Ambient Background Audio: Loops from the start until candles are blown -->
    <audio id="bgMusic" loop preload="auto">
      <source src="final-rfiy.mp3" type="audio/mpeg">
      <source src="final-rfin.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Discreet Music Toggle Button -->
    <button class="music-toggle-btn" id="musicToggle" aria-label="Toggle Background Music" title="Background Music (M)">
      <svg class="music-note" id="musicIconOn" viewBox="0 0 24 24">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </svg>
      <svg class="music-note-off" id="musicIconOff" viewBox="0 0 24 24" style="display: none;">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
        <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2" />
      </svg>
    </button>

    <!-- Blurred Floral Backdrop (Second Image) -->
    <div class="backdrop-container" aria-hidden="true">
      <img src="opening_backdrop.jpg" alt="" class="backdrop-image" />
    </div>

    <!-- Vignette & Warmth Overlay -->
    <div class="backdrop-overlay" aria-hidden="true"></div>

    <!-- Drifting Petals Layer -->
    <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>

    <!-- Central 4:5 Keepsake Card (First Image) -->
    <main class="card-stage" id="cardStage">
      <div class="card-4x5" id="card4x5">
        <img
          src="opening_card.jpg"
          alt="A romantic card for Muskan. Hey, Muskan. There's a little something waiting for you. Just for you, always."
          class="card-art"
          draggable="false"
        />

        <!-- Screen-reader semantics -->
        <h1 class="sr-only">Hey, Muskan. There's a little something waiting for you</h1>
        <p class="sr-only">just for you, always</p>

        <!-- Interactive Plaque Action Button -->
        <a
          href="scrapbook.html"
          class="card-action-btn"
          id="enterBtn"
          role="button"
          aria-label="There's something I made for you"
        >
          <span class="btn-shine" aria-hidden="true"></span>
          <span class="btn-sparkle-indicator" aria-hidden="true">✧</span>
        </a>
      </div>
    </main>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // 1. PAGE TRANSITION & AUDIO UNLOCK
    // ═══════════════════════════════════════════════════════════
    const enterBtn = document.getElementById('enterBtn');
    if (enterBtn) {
      enterBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const targetUrl = this.getAttribute('href');

        // Unmute and play music smoothly on user interaction
        if (!isMusicManuallyMuted && bgMusic) {
          bgMusic.volume = 0.65;
          bgMusic.loop = true;
          bgMusic.play().catch(() => {});
          sessionStorage.setItem(musicPreferenceKey, 'false');
          sessionStorage.setItem('bgMusicPlaying', 'true');
          sessionStorage.setItem('bgMusicTime', (bgMusic.currentTime || 0).toString());
        }

        document.body.classList.add('page-leaving');
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 550);
      });
    }

    // Also allow tapping/clicking the card to enter for effortless mobile interaction
    const card4x5 = document.getElementById('card4x5');
    if (card4x5 && enterBtn) {
      card4x5.addEventListener('click', function(e) {
        if (e.target !== enterBtn && !enterBtn.contains(e.target)) {
          enterBtn.click();
        }
      });
    }

    // ═══════════════════════════════════════════════════════════
    // 2. SLOW, TRANQUIL DRIFTING PETALS
    // ═══════════════════════════════════════════════════════════
    const petalLayer = document.getElementById('petalLayer');

    function createPetalSvg(size, petalColor) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 32 32');
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      const gradId = 'petalGrad-' + Math.random().toString(36).substring(2, 8);
      svg.innerHTML = `
        <defs>
          <linearGradient id="${gradId}" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#FFE3E7" />
            <stop offset="55%" stop-color="${petalColor}" />
            <stop offset="100%" stop-color="#DE8290" />
          </linearGradient>
        </defs>
        <path d="M16 2 C23 6 30 14 26 23 C22 30 11 31 6 24 C2 17 8 8 16 2 Z"
              fill="url(#${gradId})" />
      `;
      return svg;
    }

    const petalColors = ['#F9A7B3', '#FCA5B0', '#F7B2BC', '#EE9BA8', '#FAB1BD'];

    function spawnPetal() {
      if (document.hidden) return;
      if (petalLayer.querySelectorAll('.drifting-petal').length >= 5) return;

      const size = Math.floor(Math.random() * 8) + 20; // 20px - 28px
      const startLeft = Math.random() * 84 + 8; // 8% - 92%
      const duration = Math.random() * 6 + 11; // 11s - 17s
      const drift = (Math.random() - 0.5) * 80;
      const rot = Math.floor(Math.random() * 120) + 60;
      const color = petalColors[Math.floor(Math.random() * petalColors.length)];

      const petal = document.createElement('div');
      petal.className = 'drifting-petal';
      petal.style.left = startLeft + '%';
      petal.style.top = '-35px';
      petal.style.setProperty('--drift', drift + 'px');
      petal.style.setProperty('--rot', rot + 'deg');
      petal.style.animation = `petalFloat ${duration}s cubic-bezier(0.3, 0.2, 0.4, 0.9) forwards`;

      petal.appendChild(createPetalSvg(size, color));
      petalLayer.appendChild(petal);

      setTimeout(() => petal.remove(), duration * 1000);
    }

    setTimeout(spawnPetal, 600);
    setTimeout(spawnPetal, 2600);
    setInterval(spawnPetal, 3800);

    // ═══════════════════════════════════════════════════════════
    // 3. BACKGROUND MUSIC CONTROLLER
    // ═══════════════════════════════════════════════════════════
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    const musicIconOn = document.getElementById('musicIconOn');
    const musicIconOff = document.getElementById('musicIconOff');

    sessionStorage.removeItem('bgMusicStopped');
    const musicPreferenceKey = 'muskanMusicManuallyMuted';
    sessionStorage.setItem(musicPreferenceKey, 'false');
    let isMusicManuallyMuted = false;

    function updateMusicButtonUi(isPlaying) {
      if (!musicToggle) return;
      if (isPlaying) {
        musicToggle.classList.add('is-playing');
        if (musicIconOn) musicIconOn.style.display = 'block';
        if (musicIconOff) musicIconOff.style.display = 'none';
        musicToggle.setAttribute('title', 'Pause Music');
        musicToggle.setAttribute('aria-label', 'Pause Music');
      } else {
        musicToggle.classList.remove('is-playing');
        if (musicIconOn) musicIconOn.style.display = 'none';
        if (musicIconOff) musicIconOff.style.display = 'block';
        musicToggle.setAttribute('title', 'Play Music');
        musicToggle.setAttribute('aria-label', 'Play Music');
      }
    }

    function startBgMusic() {
      if (!bgMusic || isMusicManuallyMuted) return;
      bgMusic.volume = 0.65;
      bgMusic.loop = true;

      const playPromise = bgMusic.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            updateMusicButtonUi(true);
            sessionStorage.setItem('bgMusicPlaying', 'true');
          })
          .catch(() => {
            updateMusicButtonUi(false);
          });
      }
    }

    if (musicToggle) {
      musicToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!bgMusic) return;

        if (!bgMusic.paused) {
          isMusicManuallyMuted = true;
          sessionStorage.setItem(musicPreferenceKey, 'true');
          bgMusic.pause();
          updateMusicButtonUi(false);
          sessionStorage.setItem('bgMusicPlaying', 'false');
        } else {
          isMusicManuallyMuted = false;
          sessionStorage.setItem(musicPreferenceKey, 'false');
          bgMusic.volume = 0.65;
          bgMusic.play().then(() => {
            updateMusicButtonUi(true);
            sessionStorage.setItem('bgMusicPlaying', 'true');
          }).catch(() => {});
        }
      });
    }

    // Keyboard shortcut 'm' for mute/unmute
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M') && !e.target.matches('input, textarea')) {
        if (musicToggle) musicToggle.click();
      }
    });

    window.addEventListener('beforeunload', () => {
      if (bgMusic && !bgMusic.paused) {
        sessionStorage.setItem('bgMusicTime', bgMusic.currentTime.toString());
      }
    });

    // One-time gesture listener to unlock audio as soon as user touches or clicks
    const userGestureEvents = ['click', 'touchstart', 'pointerdown'];
    function unlockAudioOnGesture() {
      if (!isMusicManuallyMuted && bgMusic && bgMusic.paused) {
        startBgMusic();
      }
      userGestureEvents.forEach(evt => window.removeEventListener(evt, unlockAudioOnGesture));
    }
    userGestureEvents.forEach(evt => window.addEventListener(evt, unlockAudioOnGesture, { passive: true }));

    startBgMusic();
  </script>
</body>
</html>
